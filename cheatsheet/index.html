    function escapeHtml(text) {
      if (!text) return '';
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function copyToClipboard(text, btnElement) {
      navigator.clipboard.writeText(text).then(() => {
        const icon = btnElement.querySelector('i');
        icon.setAttribute('data-lucide', 'check');
        icon.classList.add('text-emerald-500');
        lucide.createIcons();

        setTimeout(() => {
          icon.setAttribute('data-lucide', 'copy');
          icon.classList.remove('text-emerald-500');
          lucide.createIcons();
        }, 2000);
      });
    }

      return `
    <div class="my-3 group">
      ${labelHtml}
      <div class="relative bg-dark-bg border border-dark-border rounded-md overflow-hidden">
        <div class="absolute right-2 top-2 opacity-0 group-hover:opacity-100 transition-opacity">
          <button
            onclick="copyToClipboard(decodeURIComponent('${encodeURIComponent(code)}'), this)"
            class="p-1.5 rounded-md bg-zinc-800 hover:bg-zinc-700 text-zinc-400 hover:text-white transition-colors"
            title="Copy command"
          >
            <i data-lucide="copy" class="w-3.5 h-3.5"></i>
          </button>
        </div>
        <pre class="p-4 overflow-x-auto text-sm font-mono leading-relaxed text-zinc-300 whitespace-pre-wrap break-all"><code class="language-bash">${safeCode}</code></pre>
      </div>
    </div>
  `;
    }

    function getSubSectionId(parentId, index) {
      return `sub-${parentId}-${index}`;
    }

    function renderSubSection(sub, parentId, index, theme = 'hacker') {
      const subId = getSubSectionId(parentId, index);

      const wrapperStart = `<div id="${subId}" class="sub-scroll-mt mb-8 group/item">`;
      const wrapperEnd = `</div>`;

      const objectiveHtml = sub.objective
        ? `<div class="mb-3 text-xs flex items-center text-zinc-500 font-medium">
         <span class="bg-zinc-800 text-zinc-400 px-1.5 py-0.5 rounded border border-zinc-700 mr-2 font-mono text-[10px]">OBJ</span> 
         ${escapeHtml(sub.objective)}
       </div>`
        : '';

      if (sub.type === 'workflow') {
        const commandsHtml = sub.commands ? sub.commands.map(c => renderCodeBlock(c.label, c.cmd, theme)).join('') : '';
        const notesHtml = sub.notes ? `<div class="mt-3 text-sm text-yellow-500/80 italic"><strong>Note:</strong> ${sub.notes.join(' ')}</div>` : '';

        return `
      ${wrapperStart}
      <div class="bg-zinc-900/50 border border-l-4 border-l-${theme}-500 border-zinc-800 rounded-lg p-5 shadow-sm hover:border-zinc-700 transition-colors">
        <h3 class="text-lg font-bold text-white mb-2 flex items-center">
          <i data-lucide="terminal" class="mr-2 text-${theme}-500 w-4.5 h-4.5"></i>
          ${escapeHtml(sub.title)}
        </h3>
        ${objectiveHtml}
        ${sub.description ? `<p class="text-zinc-400 mb-4">${escapeHtml(sub.description)}</p>` : ''}
        ${commandsHtml}
        ${notesHtml}
      </div>
      ${wrapperEnd}
    `;
      }

      if (sub.type === 'card') {
        const listHtml = sub.list ? `
      <ul class="space-y-2">
        ${sub.list.map(item => `
          <li class="flex items-start text-zinc-300 text-sm">
            <i data-lucide="chevron-right" class="text-${theme}-500 mr-2 mt-0.5 flex-shrink-0 w-4 h-4"></i>
            <span>${escapeHtml(item)}</span>
          </li>
        `).join('')}
      </ul>
    ` : '';

        return `
      ${wrapperStart}
      <div class="bg-zinc-900 border border-zinc-800 rounded-lg p-5">
        <h3 class="text-lg font-semibold text-white mb-2 border-b border-zinc-800 pb-2">${escapeHtml(sub.title)}</h3>
        ${objectiveHtml}
        <div class="mt-2">
            ${listHtml}
        </div>
      </div>
      ${wrapperEnd}
    `;
      }

      const commandsHtml = sub.commands ? `<div class="space-y-2">${sub.commands.map(c => renderCodeBlock(c.label, c.cmd, theme)).join('')}</div>` : '';
      const listHtml = sub.list ? `
    <ul class="mt-3 space-y-1">
      ${sub.list.map(item => `
        <li class="flex items-center text-zinc-400 text-sm">
          <div class="w-1.5 h-1.5 rounded-full bg-${theme}-600 mr-2"></div>
          ${escapeHtml(item)}
        </li>
      `).join('')}
    </ul>
  ` : '';

      return `
    ${wrapperStart}
      <h3 class="text-lg font-semibold text-${theme}-300 mb-2 flex items-center">
        ${escapeHtml(sub.title)}
      </h3>
      ${objectiveHtml}
      ${sub.description ? `<p class="text-sm text-zinc-400 mb-3">${escapeHtml(sub.description)}</p>` : ''}
      ${commandsHtml}
      ${listHtml}
    ${wrapperEnd}
  `;
    }

    function renderSection(section) {
      const theme = section.theme || 'hacker';
      const contentHtml = section.content.map((sub, index) => renderSubSection(sub, section.id, index, theme)).join('');

      return `
    <div id="${section.id}" class="section-container scroll-mt-24 mb-16">
      <div class="flex items-center mb-6">
        <h2 class="text-2xl font-bold text-white tracking-tight">${escapeHtml(section.title)}</h2>
        <div class="h-px bg-zinc-800 flex-grow ml-4"></div>
      </div>
      <div class="grid grid-cols-1 gap-4">
        ${contentHtml}
      </div>
    </div>
  `;
    }

    function renderNavTree() {
      navContainer.innerHTML = CHEATSHEET_DATA.map(section => {
        const baseClasses = "w-full text-left px-3 py-2 rounded-md text-sm font-medium transition-all duration-200 flex items-center justify-between group nav-main-item";

        const subItemsHtml = section.content.map((sub, idx) => {
          const subId = getSubSectionId(section.id, idx);
          const subBaseClass = "block w-full text-left px-2 py-1.5 text-xs rounded-md transition-colors truncate text-zinc-500 hover:text-zinc-300 hover:bg-zinc-800/50 nav-sub-item";

          return `
            <button 
                id="nav-link-${subId}"
                onclick="scrollToSubSection('${subId}', event)"
                class="${subBaseClass}"
                data-parent="${section.id}"
                title="${escapeHtml(sub.title)}"
            >
                ${escapeHtml(sub.title)}
            </button>
        `;
        }).join('');

        return `
      <div class="mb-1">
        <button
            id="nav-btn-${section.id}"
            onclick="handleMainSectionClick('${section.id}')"
            class="${baseClasses}"
            data-section="${section.id}"
        >
            <div class="flex items-center">
                <i data-lucide="${section.icon || 'terminal'}" class="nav-icon mr-3 w-4 h-4 text-zinc-600 group-hover:text-zinc-400 transition-colors"></i>
                <span class="nav-text text-zinc-400 group-hover:text-white transition-colors">${escapeHtml(section.title)}</span>
            </div>
            <i data-lucide="chevron-right" class="nav-chevron w-3 h-3 text-zinc-600 transition-transform duration-300"></i>
        </button>
        
        <div id="nav-wrapper-${section.id}" class="nav-submenu-wrapper">
            <div class="nav-submenu-inner ml-4 pl-3 border-l border-zinc-800 space-y-0.5 my-1">
                ${subItemsHtml}
            </div>
        </div>
      </div>
    `;
      }).join('');
      lucide.createIcons();
    }

    function updateNavState() {
      CHEATSHEET_DATA.forEach(section => {
        const isActive = section.id === activeSectionId;
        const isExpanded = expandedSections.has(section.id);
        const theme = section.theme || 'hacker';

        const btn = document.getElementById(`nav-btn-${section.id}`);
        const wrapper = document.getElementById(`nav-wrapper-${section.id}`);
        const icon = btn.querySelector('.nav-icon');
        const text = btn.querySelector('.nav-text');
        const chevron = btn.querySelector('.nav-chevron');

        if (isActive) {
          btn.classList.add('bg-zinc-800/50');
          text.classList.replace('text-zinc-400', 'text-white');
          icon.classList.add(`text-${theme}-500`);
          icon.classList.remove('text-zinc-600', 'group-hover:text-zinc-400');
        } else {
          btn.classList.remove('bg-zinc-800/50');
          text.classList.replace('text-white', 'text-zinc-400');
          icon.classList.remove(`text-${theme}-500`);
          icon.classList.add('text-zinc-600', 'group-hover:text-zinc-400');
        }

        if (isExpanded) {
          wrapper.classList.add('expanded');
          chevron.classList.add('rotate-90');
        } else {
          wrapper.classList.remove('expanded');
          chevron.classList.remove('rotate-90');
        }

        section.content.forEach((sub, idx) => {
          const subId = getSubSectionId(section.id, idx);
          const subBtn = document.getElementById(`nav-link-${subId}`);

          if (subBtn) {
            if (subId === activeSubSectionId) {
              subBtn.classList.add(`text-${theme}-400`, `bg-${theme}-500/10`, 'font-medium');
              subBtn.classList.remove('text-zinc-500', 'hover:text-zinc-300', 'hover:bg-zinc-800/50');
            } else {
              subBtn.classList.remove(`text-${theme}-400`, `bg-${theme}-500/10`, 'font-medium');
              subBtn.classList.add('text-zinc-500', 'hover:text-zinc-300', 'hover:bg-zinc-800/50');
            }
          }
        });
      });
    }

    function renderContent() {
      const query = searchQuery.toLowerCase();

      const filteredData = CHEATSHEET_DATA.map(section => {
        const matchesTitle = section.title.toLowerCase().includes(query);
        const matchedContent = section.content.filter(sub =>
          sub.title.toLowerCase().includes(query) ||
          (sub.description && sub.description.toLowerCase().includes(query)) ||
          (sub.objective && sub.objective.toLowerCase().includes(query)) ||
          (sub.commands && sub.commands.some(c => c.cmd.toLowerCase().includes(query) || (c.label && c.label.toLowerCase().includes(query))))
        );

        if (matchesTitle || matchedContent.length > 0) {
          return {
            ...section,
            content: matchesTitle ? section.content : matchedContent
          };
        }
        return null;
      }).filter(Boolean);

      if (filteredData.length === 0) {
        contentContainer.innerHTML = '';
        emptyStateEl.classList.remove('hidden');
      } else {
        emptyStateEl.classList.add('hidden');
        contentContainer.innerHTML = filteredData.map(renderSection).join('');
      }
      lucide.createIcons();
    }

    function handleMainSectionClick(id) {
      if (expandedSections.has(id)) {
        if (activeSectionId === id) {
          expandedSections.delete(id);
        } else {
          activeSectionId = id;
          scrollToSection(id);
        }
      } else {
        expandedSections.clear();
        expandedSections.add(id);
        activeSectionId = id;
        scrollToSection(id);
      }
      updateNavState();
    }

    function scrollToSection(id) {
      const element = document.getElementById(id);
      if (element) {
        const offset = 80;
        const elementPosition = element.getBoundingClientRect().top;
        const offsetPosition = elementPosition + window.pageYOffset - offset;

        window.scrollTo({
          top: offsetPosition,
          behavior: "smooth"
        });

        if (window.innerWidth < 1024) {
          toggleSidebar(false);
        }
      }
    }

    function scrollToSubSection(subId, event) {
      event.stopPropagation();
      const element = document.getElementById(subId);
      if (element) {
        const offset = 100;
        const elementPosition = element.getBoundingClientRect().top;
        const offsetPosition = elementPosition + window.pageYOffset - offset;

        window.scrollTo({
          top: offsetPosition,
          behavior: "smooth"
        });

        if (window.innerWidth < 1024) {
          toggleSidebar(false);
        }
      }
    }

    function toggleSidebar(show) {
      isSidebarOpen = typeof show === 'boolean' ? show : !isSidebarOpen;

      if (isSidebarOpen) {
        sidebarEl.classList.remove('-translate-x-full');
        mobileMenuBtn.innerHTML = '<i data-lucide="x" class="w-6 h-6"></i>';
      } else {
        sidebarEl.classList.add('-translate-x-full');
        mobileMenuBtn.innerHTML = '<i data-lucide="menu" class="w-6 h-6"></i>';
      }
      lucide.createIcons();
    }

    mobileMenuBtn.addEventListener('click', () => toggleSidebar());

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderContent();
    });

    let isScrolling = false;
    let scrollTimeout;

    function handleScroll() {
      if (isScrolling) return;

      const scrollPosition = window.scrollY + 150;
      let newActiveId = CHEATSHEET_DATA[0].id;
      let newActiveSubId = null;

      for (let i = CHEATSHEET_DATA.length - 1; i >= 0; i--) {
        const section = CHEATSHEET_DATA[i];
        const sectionEl = document.getElementById(section.id);

        if (sectionEl && sectionEl.offsetTop <= scrollPosition) {
          newActiveId = section.id;

          for (let j = 0; j < section.content.length; j++) {
            const subId = getSubSectionId(section.id, j);
            const subEl = document.getElementById(subId);
            if (subEl && subEl.offsetTop <= (scrollPosition + 100)) {
              newActiveSubId = subId;
            }
          }
          break;
        }
      }

      let stateChanged = false;

      if (activeSectionId !== newActiveId) {
        activeSectionId = newActiveId;

        if (!expandedSections.has(newActiveId)) {
          expandedSections.clear();
          expandedSections.add(newActiveId);
        }
        stateChanged = true;
      }

      if (activeSubSectionId !== newActiveSubId) {
        activeSubSectionId = newActiveSubId;
        stateChanged = true;
      }

      if (stateChanged) {
        updateNavState();
      }
    }

    window.addEventListener('scroll', () => {
      if (scrollTimeout) clearTimeout(scrollTimeout);
      scrollTimeout = setTimeout(handleScroll, 20);
    });

    renderContent();
    renderNavTree();
    updateNavState();
    lucide.createIcons();
    window.copyToClipboard = copyToClipboard;
    window.scrollToSection = scrollToSection;
    window.scrollToSubSection = scrollToSubSection;
    window.handleMainSectionClick = handleMainSectionClick;

  </script>
</body>

</html>
